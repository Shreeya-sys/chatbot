<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">HealthGuard AI application architecture</title>
  <desc id="desc">A system architecture diagram showing a Streamlit frontend connected to a Python backend, Stripe billing, LLM providers, trusted web sources, and a Chroma vector database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748b" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.heading{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.label{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.body{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.small{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="80" y="76" class="title">HealthGuard AI · System Architecture</text>
  <text x="80" y="108" class="subtitle">Evidence-based healthcare chatbot with retrieval, safety checks, citations, and optional billing</text>

  <!-- layers -->
  <rect x="55" y="145" width="1490" height="220" rx="24" fill="#dbeafe" fill-opacity=".52" stroke="#bfdbfe" stroke-width="2"/>
  <text x="85" y="183" class="small" fill="#1d4ed8">USER EXPERIENCE</text>
  <rect x="90" y="205" width="450" height="125" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="125" y="247" class="heading">Frontend · Streamlit</text>
  <text x="125" y="278" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#dbeafe">Chat UI · claim verification · citations</text>
  <text x="125" y="304" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#dbeafe">API-key inputs · conversation controls</text>

  <rect x="590" y="205" width="420" height="125" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="247" class="label">Authentication &amp; session</text>
  <text x="625" y="278" class="body">Streamlit session state</text>
  <text x="625" y="304" class="body">Conversation memory · safety notice</text>

  <rect x="1060" y="205" width="420" height="125" rx="18" fill="#fff" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="247" class="label">Stripe · optional billing</text>
  <text x="1095" y="278" class="body">Checkout · subscriptions · webhooks</text>
  <text x="1095" y="304" class="body">Connect only through backend</text>

  <!-- backend -->
  <rect x="55" y="405" width="1490" height="260" rx="24" fill="#ede9fe" fill-opacity=".60" stroke="#ddd6fe" stroke-width="2"/>
  <text x="85" y="443" class="small" fill="#6d28d9">APPLICATION / BACKEND</text>
  <rect x="90" y="468" width="390" height="150" rx="18" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="125" y="510" class="heading">Python backend · app.py</text>
  <text x="125" y="541" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#ede9fe">Request routing · response formatting</text>
  <text x="125" y="568" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#ede9fe">Safety · scope · claim verification</text>
  <text x="125" y="595" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#ede9fe">Billing webhook validation</text>

  <rect x="530" y="468" width="280" height="150" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="510" class="label">RAG pipeline</text>
  <text x="565" y="541" class="body">Retrieve top-k evidence</text>
  <text x="565" y="568" class="body">Generate cited answer</text>
  <text x="565" y="595" class="body">Verify health claims</text>

  <rect x="860" y="468" width="280" height="150" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="510" class="label">Local Ollama</text>
  <text x="895" y="541" class="body">Local model generation</text>
  <text x="895" y="568" class="body">No cloud API keys</text>
  <text x="895" y="595" class="body">Configurable local model</text>

  <rect x="1190" y="468" width="290" height="150" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1225" y="510" class="label">Data &amp; billing</text>
  <text x="1225" y="541" class="body">Stripe secret operations</text>
  <text x="1225" y="568" class="body">Webhook event handling</text>
  <text x="1225" y="595" class="body">No secrets in frontend</text>

  <!-- data / external -->
  <rect x="55" y="705" width="1490" height="205" rx="24" fill="#d1fae5" fill-opacity=".55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="85" y="743" class="small" fill="#047857">DATA &amp; EXTERNAL SERVICES</text>
  <rect x="90" y="765" width="360" height="105" rx="18" fill="url(#green)" filter="url(#shadow)"/>
  <text x="125" y="806" class="heading">ChromaDB · vector database</text>
  <text x="125" y="837" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#d1fae5">Embeddings · trusted medical sources</text>

  <rect x="520" y="765" width="330" height="105" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="806" class="label">Source documents</text>
  <text x="555" y="837" class="body">CDC · WHO · NIH · MedlinePlus</text>

  <rect x="920" y="765" width="250" height="105" rx="18" fill="#fff" stroke="#fcd34d" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="806" class="label">Stripe platform</text>
  <text x="955" y="837" class="body">Payments · customer portal</text>

  <rect x="1240" y="765" width="240" height="105" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1275" y="806" class="label">Local model</text>
  <text x="1275" y="837" class="body">Ollama · phi4-mini</text>

  <!-- connectors -->
  <path d="M540 267 H590" class="line"/>
  <path d="M1010 267 H1060" class="dashed"/>
  <path d="M305 330 V468" class="line"/>
  <path d="M480 543 H530" class="line"/>
  <path d="M810 543 H860" class="line"/>
  <path d="M1140 543 H1190" class="dashed"/>
  <path d="M650 618 V700 H270 V765" class="line"/>
  <path d="M650 618 V700 H685 V765" class="dashed"/>
  <path d="M1000 618 V700 H1360 V765" class="line"/>
  <path d="M1335 618 V700 H1045 V765" class="dashed"/>
  <text x="357" y="458" class="small">HTTPS / app calls</text>
  <text x="765" y="687" class="small">retrieval</text>
  <text x="1110" y="687" class="small">API calls</text>

  <text x="80" y="945" class="small">Solid arrows = current chatbot flow · Dashed arrows = optional or planned integration</text>
</svg>